@RESOURCE_DEFINITION[ULVCircuit1]
{
  chitaktechDescription = A primitive computing device built from a handful of vacuum tubes and simple logic. Barely capable of controlling machinery, but sufficient to bootstrap the first generation of electrical industry.
}
@RESOURCE_DEFINITION[ULVCircuit2]
{
  chitaktechDescription = The first practical industrial control circuit. Combining vacuum tubes, relays, and passive components, it provides the basic intelligence required for most ULV machines.
}
@RESOURCE_DEFINITION[ULVCircuit3]
{
  chitaktechDescription = An integrated control system combining the functions of Basic, Power, and Logistic circuits. Capable of coordinating complex industrial processes and allowing the development of higher technologies.
}
@RESOURCE_DEFINITION[ULVCircuit4]
{
  chitaktechDescription = Designed for moving resources rather than processing them. Uses relay logic and mechanical counters to route items, detect blockages, and coordinate primitive automation systems.
}
@RESOURCE_DEFINITION[ULVCircuit5]
{
  chitaktechDescription = Specialized for electrical control and protection. Equipped with relays, fuses, and emergency disconnect systems to safely manage power generation, storage, and distribution.
}
@RESOURCE_DEFINITION[ULVCircuit6]
{
  chitaktechDescription = Built for harsh industrial environments. Acid-resistant materials and precise analog controls allow it to regulate temperatures, pressures, and chemical processes without contamination.
}
@RESOURCE_DEFINITION[ULVCircuit7]
{
  chitaktechDescription = A heavily shielded control package intended for radioactive materials. Incorporates containment monitoring and multiple mechanical fail-safes to safely handle the earliest nuclear technologies.
}
@RESOURCE_DEFINITION[ULVCircuit8]
{
  chitaktechDescription = A room-sized electromechanical computer condensed into a single industrial package. Packed with vacuum tubes, relay matrices, and memory systems, it can coordinate entire factories and massive machines.
}