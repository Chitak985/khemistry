Sigma88LoadingScreens
{
	removeStockScreens = False
	removeStockTips = False
}
@Sigma88LoadingScreens:HAS[@ChitakTechSettings[#LoadingScreens[?rue]]]
{
	folder = ChitakTech/Patches/LoadingScreens
	logoScreen = ChitakTech/Patches/LoadingScreens/logo.png
}
@Sigma88LoadingScreens:HAS[@ChitakTechSettings[#LoadingTips[?rue]]]
{
	tipsFile = ChitakTech/Patches/LoadingScreens/Tips.txt
}
@Sigma88LoadingScreens:HAS[@ChitakTechSettings[#ReplaceStockLoadingScreens[?rue]]]
{
	removeStockScreens = True
}
@Sigma88LoadingScreens:HAS[@ChitakTechSettings[#ReplaceStockTips[?rue]]]
{
	removeStockTips = True
}
