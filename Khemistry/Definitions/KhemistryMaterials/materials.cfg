KHEMISTRY_MATERIAL
{
	name = Iron-Nickel-Copper Alloy
	SHAPES
	{
		name = Bloom
	}
	PARAMS  // all parameters as 100, aka 10.0%
	{
		iron = 34
		nickel = 33
		copper = 33
	}
}

KHEMISTRY_MATERIAL
{
	name = Lodestone
	SHAPES
	{
		name = Sphere
	}
	PARAMS
    {
        remanence = 1  // 0 - 1, how strongly magnetic it is, 0 is none and 1 is exceptional
        coercivity = 0  // 0 - 1, how hard it is to demagnetize
    }
}

KHEMISTRY_MATERIAL
{
	name = Water
	SHAPES
	{
		name = Fluid
		name = Solid
	}
	PARAMS
	{
		pH = 7  // Acidity
		tts = 0  // mg/L, Total Suspended Solids 
		turbidity = 0  // NTU
		tds = 0  // mg/L, Total Dissolved Solids
		eConductivity = 0  // microS/cm
		eResistivity = 0  // Mom*cm, DERIVE FROM eConductivity
		totalHardness = 0  // mg/L as CaCO3, DERIVED
		alkalinity = 0  // mg/L as CaCO3
		toc = 0  // mg/L, Total Organic Content
		oilAndGrease = 0  // mg/L
		cod = 0  // mg O2/L
		bod5 = 0  // mg O2/L
		silica = 0  // mg/L as SIO2
		// mg/L for the rest (dissolved things)
		disNa = 0
		disK = 0
		disCa = 0
		disMg = 0
		disFe = 0
		disMn = 0
		disAl = 0
		disCu = 0
		disZn = 0
		disCl = 0
		disF = 0
		disSulfate = 0
		disBicarbonate = 0
		disNitrate = 0
		disPhosphate = 0
		disAmmonia = 0  // mg/L as N
		disO2 = 0
		disCO2 = 0
		disH2S = 0
		microbialCount = 0  // CFU/ml
		temp = 25  // C
	}
}