KHEMISTRY_MATERIAL
{
	name = Water
	SHAPES
	{
		name = Fluid
		name = Solid
	}
	PARAMS
	{
		// Main values
		pH = 7  // Acidity
		tts = 0  // mg/L, Total Suspended Solids
		tds = 0  // mg/L, Total Dissolved Solids
		turbidity = 0  // NTU
		eConductivity = 0  // microS/cm
		alkalinity = 0  // mg/L as CaCO3
		toc = 0  // mg/L, Total Organic Content
		oilAndGrease = 0  // mg/L
		cod = 0  // mg O2/L
		bod5 = 0  // mg O2/L
		silica = 0  // mg/L as SIO2
		disNa = 0  // mg/l, dissolved in water
		disK = 0  // mg/l, dissolved in water
		disCa = 0  // mg/l, dissolved in water
		disMg = 0  // mg/l, dissolved in water
		disFe = 0  // mg/l, dissolved in water
		disMn = 0  // mg/l, dissolved in water
		disAl = 0  // mg/l, dissolved in water
		disCu = 0  // mg/l, dissolved in water
		disZn = 0  // mg/l, dissolved in water
		disCl = 0  // mg/l, dissolved in water
		disF = 0  // mg/l, dissolved in water
		disSulfate = 0  // mg/l, dissolved in water
		disNitrate = 0  // mg/l, dissolved in water
		totalDissolvedPhosphate = 0  // mg/l, dissolved in water
		totalAmmoniaNitrogen = 0  // mg/l as N, NH3 + NH4+
		disO2 = 0  // mg/l, dissolved in water
		dic = 0  // mg C/l or mmol/l
		totalDissolvedSulfide = 0  // mg/l, H2S + HS- + S2-
		microbialCount = 0  // CFU/ml
		temp = 25  // Celsius

		// Derived helpers
		m3 = DERamount*volume  // m3, the total volume this material instance takes up
		eResistivity = DER1/eConductivity  // Mom*cm
		totalHardness = DER(2.497*disCa)+(4.118*disMg)  // mg/L as CaCO3
	}
	PARAM_MERGING  // Variables from the material being merged are available with an O at the end. Any that are not included are averaged.
	{
		pH = -Log10((-(((Pow(10,pH-14)-Pow(10,-pH))*m3+(Pow(10,pHO-14)-Pow(10,-pHO))*m3O)/(m3+m3O))+Sqrt(Pow((((Pow(10,pH-14)-Pow(10,-pH))*m3+(Pow(10,pHO-14)-Pow(10,-pHO))*m3O)/(m3+m3O)),2)+4*Pow(10,-14)))/2)
	}
}