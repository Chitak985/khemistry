////////////////////////////// blastFurnace Recipes //////////////////////////////

//////////////////// bloomery subtype ////////////////////

KHEMISTRYBATCHISRU_RECIPE
{
    name = Blast heavy fraction of Surface Laterite Ore into Raw Bloom Iron
    recipeType = blastFurnace
    recipeSubtype = bloomery
	recipeTime = 21600  // 6 hours

	PLANET_CONFIG
	{
		name = ALL
		BIOME_CONFIG
		{
			name = ALL

			maxG = 15
			maxOperatingG = 5
			situationOperating = Landed
			situationOperating = FlyingLow
			situationDestructive = Splashed
			situationDestructive = FlyingHigh
			situationDestructive = SpaceLow
			situationDestructive = SpaceHigh
			situationDestructive = SubOrbital
			minTemperature = -80C
			maxTemperature = 250C
			minOperatingTemperature = -40C
			maxOperatingTemperature = 50C
			minPressure = 15
			maxPressure = 300
			minOperatingPressure = 60
			maxOperatingPressure = 150
		}
	}
	PINPUT_RESOURCE
	{
		name = KerbinAir
		amount = 0.043
		period = 1
		powerfail = VOID
	}
    controlRules = EVA
    workersEngineers = 1
    workersType = EVA
	
	INPUT_RESOURCE
	{
		name = HeavySurfaceLateriteOre
		amount = 36
	}
	INPUT_RESOURCE
	{
		name = MetallurgicalCharcoal
		amount = 18
	}
	INPUT_RESOURCE
	{
		name = FluxLimestone
		amount = 4
	}
	OUTPUT_RESOURCE_MATERIAL  // 12 kg, 4000 kg/m3
	{
		name = Raw Bloom Iron
		shape = Bloom
		size = 0.24x0.18x0.14  // in meters
		PARAMS
		{
			source = SLaterite
		}
		outVolume = 0.003  // meters cubed
	}
	OUTPUT_RESOURCE
	{
		name = BloomIronSurfaceLateriteSlag
		amount = 15.5
	}
}
