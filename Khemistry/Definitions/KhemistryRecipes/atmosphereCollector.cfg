////////////////////////////// atmosphereCollector Recipes //////////////////////////////

KHEMISTRYISRU_RECIPE:NEEDS[!SolSystem]
{
    name = Collect Kerbin Air
    recipeType = atmosphereCollector
	recipeTime = 1

	PLANET_CONFIG
	{
		name = ALL
		BIOME_CONFIG
		{
			name = ALL

			situationOperating = Landed
			situationOperating = FlyingLow
		}
	}

	OUTPUT_RESOURCE
	{
		name = KerbinAir
		amount = 1
	}
}
