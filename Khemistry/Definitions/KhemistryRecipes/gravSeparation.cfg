// The Sandline
KHEMISTRY_RECIPE:NEEDS[!RealSolarSystem]
{
	recipeType = gravSeparation
	ConverterName = Weight separate Non-Magnetic Kerbin Sand
	INPUT_RESOURCE
	{
		ResourceName = KerbinSand_Non_Magnetic
		Ratio = 10
		FlowMode = STAGE_PRIORITY_FLOW
	}
	OUTPUT_RESOURCE
	{
		ResourceName = KerbinSand_Light
		Ratio = 9
		DumpExcess = false
	}
	OUTPUT_RESOURCE
	{
		ResourceName = KerbinSand_Heavy
		Ratio = 1
		DumpExcess = false
	}
}
