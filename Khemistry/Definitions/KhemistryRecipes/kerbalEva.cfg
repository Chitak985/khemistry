////////////////////////////// kerbalEVA Recipes //////////////////////////////

KHEMISTRYISRU_RECIPE:NEEDS[ParallaxContinued,Parallax_StockScatterTextures]
{
    name = Chop down a tree
    recipeType = kerbalEVA
	recipeTime = 30

	PLANET_CONFIG
	{
		name = Kerbin
		BIOME_CONFIG
		{
			name = ALL
			situationOperating = Landed
		}
	}

	PARALLAX_SCATTER
	{
		name = OakTree
	}
	PARALLAX_SCATTER
	{
		name = PineTree
	}
	PARALLAX_SCATTER
	{
		name = PalmTree
	}
	PARALLAX_SCATTER
	{
		name = BaobabTreeTrunk
	}

	OUTPUT_MATERIAL
	{
		name = Wood
		shape = Log
		size = none  // size is the radius parameter
		PARAMS
		{
			radius = PARALLAX_RADIUS
			height = PARALLAX_HEIGHT
			sourceScatter = PARALLAX_SCATTER
		}
		outVolume = PARALLAX_VOLUME
	}
}

KHEMISTRYISRU_RECIPE
{
    name = Divide a 28-31 meter tall Kerbin Pine Log into 5x 5m chunks with stone axe
    recipeType = kerbalEVA
	recipeTime = 300000

	PLANET_CONFIG
	{
		name = ALL
		BIOME_CONFIG
		{
			name = ALL
		}
	}

	INPUT_MATERIAL
	{
		id = main
		name = Wood
		shape = Log
		size = none  // size is the radius parameter
		amount = 1

		PARAMS
		{
			height = EL31
		    height = EM28
			radius = EL0.82
		}
	}

	OUTPUT_MATERIAL
	{
		name = Wood
		shape = Log
		size = none  // size is the radius parameter
		amount = 5
		PARAMS
		{
			radius = [(INMAT:main:radius)]
			height = [randf(4.9,5.1)]
			sourceScatter = (INMAT:main:sourceScatter)
		}
		outVolume = [PI*Pow(radius,2)*height]
	}
}

