////////////////////////////// kerbalEVA Recipes //////////////////////////////

KHEMISTRYISRU_RECIPE:NEEDS[ParallaxContinued,Parallax_StockScatterTextures]
{
    name = Chop down a tree
    recipeType = kerbalEVA
	recipeTime = 30

	PLANET_CONFIG
	{
		name = Kerbin
		BIOME_CONFIG
		{
			name = ALL
			situationOperating = Landed
		}
	}

	// Multiple nodes form the acceptable scatter set. The closest unharvested
	// collider belonging to any listed scatter is used.
	PARALLAX_SCATTER
	{
		name = OakTree
	}
	PARALLAX_SCATTER
	{
		name = PineTree
	}
	PARALLAX_SCATTER
	{
		name = PalmTree
	}
	PARALLAX_SCATTER
	{
		name = BaobabTreeTrunk
	}

	OUTPUT_MATERIAL
	{
		name = Felled Tree
		shape = Log
		size = PARALLAX_RADIUS
		PARAMS
		{
			radius = PARALLAX_RADIUS
			height = PARALLAX_HEIGHT
			sourceScatter = PARALLAX_SCATTER
		}
		outVolume = PARALLAX_VOLUME
	}
}

KHEMISTRYISRU_RECIPE
{
    name = Pick up lodestones around a Magnetite deposit
    recipeType = kerbalEVA
	recipeTime = 40

	PLANET_CONFIG
	{
		name = ALL
		BIOME_CONFIG
		{
			name = ALL
			situationOperating = Landed
		}
	}
	depositCondition = SurfaceMagnetiteOre
	
	OUTPUT_MATERIAL
	{
		name = Lodestone
		shape = Sphere
		size = randf(0.01,0.1,2)  // radius in meters
		PARAMS
		{
			remanence = randf(0.1,0.9,2)
			coercivity = randf(0.2,0.9,2)
		}
		outVolume = (4.0/3.0)*PI*Pow([size],3)  // meters cubed
	}
}
