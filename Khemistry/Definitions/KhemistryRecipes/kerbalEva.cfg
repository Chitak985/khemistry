KHEMISTRYISRU_RECIPE
{
    name = Reduce the radius of a Kerbin Pine Log with stone axe
    recipeType = kerbalEVA
	recipeTime = [(49180*PI*(INMAT:main:height)*Max(0,Pow((INMAT:main:radius),2)-Pow((SETTING:radius2),2))*randf(0.9,1.1))+0.1]

	SETTING
	{
		name = Pine Half Log Radius
		min = 0.1
		max = 1.0
		step = 0.1
		var = radius
	}
	SETTING
	{
		name = Pine Half Log Height
		min = 0.1
		max = 100.0
		step = 0.1
		var = height
	}
	SETTING
	{
		name = Pine Half Log Resulting Radius
		min = 0.1
		max = 1.0
		step = 0.1
		var = radius2
	}

	INPUT_MATERIAL
	{
		id = main
		name = Wood
		shape = Log
		size = none  // size is the radius parameter
		amount = 1

		PARAMS
		{
			height = EM(SETTING:height)-0.1
			height = EL(SETTING:height)+0.1
			radius = EM(SETTING:radius)-0.1
			radius = EL(SETTING:radius)+0.1
			radius = EM(SETTING:radius2)
		}
	}

	OUTPUT_MATERIAL
	{
		name = Wood
		shape = Log
		size = none  // size is the radius parameter
		amount = 1
		PARAMS
		{
			radius = [(SETTING:radius2)*randf(0.9,1.0)]
			height = [(INMAT:main:height)]
			sourceScatter = (INMAT:main:sourceScatter)
		}
		outVolume = [PI*Pow(radius,2)*height]
	}
}

