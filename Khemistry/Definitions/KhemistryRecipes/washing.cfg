KHEMISTRYISRU_RECIPE
{
	name = Wash Crushed Roasted Laterite Ore
	recipeType = washing
	recipeTime = 1
	
	INPUT_RESOURCE
	{
		name = CrushedRLateriteOre
		amount = 1
	}
	INPUT_MATERIAL
	{
		name = Water
		shape = Fluid
		size = none  // no size used
		amount = 1
		inVolume = 1

		PARAMS
		{
		    pH = EM5.5
		    pH = EL9.0
		
		    tts = EL2000
		    turbidity = EL500
		
		    tds = EL1500
		    eConductivity = EL2500
		
		    disCl = EL500
		    oilAndGrease = EL5
		    totalDissolvedSulfide = EL1
		
		    temp = EM1
		    temp = EL45
		}
	}

	OUPTUT_RESOURCE
	{
		name = PurifiedCRLateriteOre
		amount = 1
	}
	OUTPUT_MATERIAL
	{
		name = Water
		shape = Fluid
		size = none  // no size used
		outVolume = 1

		PARAMS
		{
		    pH = randf(5.8,7.5)
		
		    // Suspended mineral matter
		    tts = randf(5000,40000)
		    turbidity = tts/randf(25,60)
		
		    // Organic / oxygen-demand properties
		    toc = randf(0.2,6)
		    oilAndGrease = randf(0,5)
		    cod = randf(2,30)
		    bod5 = randf(0.2,3)
		
		    // Dissolved material
		    silica = randf(2,30)
		
		    disNa = randf(2,40)
		    disK = randf(0.5,15)
		    disCa = randf(5,60)
		    disMg = randf(1,30)
		
		    disFe = randf(0.1,3)
		    disMn = randf(0.01,2)
		    disAl = randf(0.02,2)
		    disCu = randf(0.001,0.05)
		    disZn = randf(0.002,0.15)
		
		    disCl = randf(2,60)
		    disF = randf(0.05,0.8)
		    disSulfate = randf(2,80)
		    disNitrate = randf(0.05,8)
		
		    totalDissolvedPhosphate = randf(0.005,0.2)
		    totalAmmoniaNitrogen = randf(0.005,0.3)
		
		    dic = randf(5,50)
		    totalDissolvedSulfide = randf(0,0.2)
		
		    // TDS must be >= the material explicitly dissolved above.
		    // 4*dic is an approximation for the mass represented by dissolved
		    // carbonate/bicarbonate species when DIC is stored as mg C/L.
		    // The last randf represents dissolved species Khemistry doesn't track.
		    tds = Max(randf(150,700),silica+disNa+disK+disCa+disMg+disFe+disMn+disAl+disCu+disZn+disCl+disF+disSulfate+disNitrate+totalDissolvedPhosphate+totalAmmoniaNitrogen+totalDissolvedSulfide+4*dic+randf(20,100))
		
		    // Approximate correlation rather than generating EC independently
		    eConductivity = tds/randf(0.55,0.75)
		
		    alkalinity = randf(10,120)
		
		    disO2 = randf(4,11)
		    microbialCount = randf(10,100000)
		
		    temp = randf(10,35)
		}
	}
}