KHEMISTRYISRU_RECIPE
{
	name = Wash Crushed Roasted Laterite Ore
	recipeType = washing
	recipeTime = 600

	controlRules = EVA
    workersEngineers = 1
    workersType = EVA
	
	INPUT_RESOURCE
	{
		name = CrushedRLateriteOre
		amount = 10
	}
	INPUT_MATERIAL
	{
		id = water
		name = Water
		shape = Fluid
		size = none
		amount = 0.05

		PARAMS
		{
			m3 = EM0.049
			m3 = EL0.051

			pH = EM5.5
			pH = EL9.0

			tts = EL2000
			turbidity = EL500

			tds = EL1500
			eConductivity = EL2500

			disCl = EL500
			oilAndGrease = EL5
			totalDissolvedSulfide = EL1

			temp = EM1
			temp = EL45
		}
	}

	OUTPUT_RESOURCE
	{
		name = PurifiedCRLateriteOre
		amount = 9
	}
	OUTPUT_RESOURCE
	{
		name = PurifiedCRLateriteOreWaste
		amount = 1
	}
	OUTPUT_MATERIAL
	{
		id = washwater
		name = Water
		shape = Fluid
		size = none
		amount = 0.05

		outVolume = [(INMAT:water:m3)]

		PARAMS
		{
			// Mild mineral-driven pH change; this is washing, not acid/base treatment.
			pH = [Min(9.2,Max(5.0,(INMAT:water:pH)+randf(-0.3,0.2)))]

			// About 0.95 kg of the removed gangue remains suspended.
			tts = [(INMAT:water:tts)+(950/(INMAT:water:m3))]
			turbidity = [tts/randf(25,60)]

			// A wooden trough and dirty ore can add a little organic material,
			// but roasted laterite should not create large organic loads.
			toc = [(INMAT:water:toc)+randf(0.1,1.5)]
			oilAndGrease = [(INMAT:water:oilAndGrease)]
			cod = [(INMAT:water:cod)+randf(0.5,8)]
			bod5 = [(INMAT:water:bod5)+randf(0.1,1)]

			// Mineral dissolution / very fine colloidal material.
			silica = [(INMAT:water:silica)+randf(5,25)]

			disNa = [(INMAT:water:disNa)+randf(1,10)]
			disK = [(INMAT:water:disK)+randf(0.5,8)]
			disCa = [(INMAT:water:disCa)+randf(1,15)]
			disMg = [(INMAT:water:disMg)+randf(0.5,8)]

			disFe = [(INMAT:water:disFe)+randf(0.2,3)]
			disMn = [(INMAT:water:disMn)+randf(0.02,1)]
			disAl = [(INMAT:water:disAl)+randf(0.1,3)]
			disCu = [(INMAT:water:disCu)+randf(0,0.03)]
			disZn = [(INMAT:water:disZn)+randf(0,0.08)]

			disCl = [(INMAT:water:disCl)+randf(0,3)]
			disF = [(INMAT:water:disF)+randf(0,0.1)]
			disSulfate = [(INMAT:water:disSulfate)+randf(1,12)]
			disNitrate = [(INMAT:water:disNitrate)+randf(0,0.5)]
			totalDissolvedPhosphate = [(INMAT:water:totalDissolvedPhosphate)+randf(0,0.1)]
			totalAmmoniaNitrogen = [(INMAT:water:totalAmmoniaNitrogen)+randf(0,0.05)]

			dic = [(INMAT:water:dic)+randf(0,5)]

			// Roasted oxide ore should not be a meaningful sulfide source.
			totalDissolvedSulfide = [Max(0,(INMAT:water:totalDissolvedSulfide)*randf(0.8,1))]

			// About 0.05 kg total newly dissolved material per batch.
			// At 0.05 m3 this contributes about 1000 mg/L.
			tds = [Max(
				(INMAT:water:tds)+(50/(INMAT:water:m3)),
				silica+disNa+disK+disCa+disMg+disFe+disMn+disAl+disCu+disZn+
				disCl+disF+disSulfate+disNitrate+totalDissolvedPhosphate+
				totalAmmoniaNitrogen+totalDissolvedSulfide+4*dic+randf(20,100)
			)]

			eConductivity = [tds/randf(0.55,0.75)]

			alkalinity = [Max(0,(INMAT:water:alkalinity)+randf(-5,15))]

			disO2 = [Min(14,Max(0,(INMAT:water:disO2)*randf(0.8,1.05)))]
			microbialCount = [Max((INMAT:water:microbialCount),randf(10,10000))]

			temp = [Min(50,Max(0,(INMAT:water:temp)+randf(-0.5,0.5)))]
		}
	}
}
