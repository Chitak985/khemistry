// GENERIC resource creation

KHEMISTRY_RECIPE
{
	recipeType = nameConversion
	ConverterName = Convert 70 C 99.5% pure Process Water to Generic 70 C 99.5% pure Water
	INPUT_RESOURCE
	{
		ResourceName = 70C_995ProcessWater
		Ratio = 1
		FlowMode = STAGE_PRIORITY_FLOW
	}
	OUTPUT_RESOURCE
	{
		ResourceName = 70C_995Water
		Ratio = 1
		DumpExcess = false
	}
}

