// Glacial Sulfide Ore processing
// Required for Crude ULV Circuits

// Glacial Sulfide processing chain:
//GSOre
//-> (GSWaste1) + GSSortedOre
//-> GSCrushedOre
//-> (GSWaste1) + GSConcentrate
//-> (GSNMConcentrate) + GSMConcentrate
//-> RoastedFeNiCu
//-> (FeNiCuSlag) + MATERIAL[Iron-Nickel-Copper Alloy (700, 200, 100)]

// Nickel Sulfide processing chain:
//NSOre
//-> Coarse Crushed Nickel Sulfide Ore
//-> Crushed Nickel Sulfide Ore
//-> (NSWaste1) + NSConcentrate
//-> (NSNMConcentrate) + NSMConcentrate
//-> RoastedFeNiCu2
//-> (FeNiCuSlag2) + MATERIAL[Iron-Nickel-Copper Alloy (644, 228, 128)]

// FeNiCu_700_200_100
// FeNiCu_673_214_113
// FeNiCu_644_228_128
// FeNiCu_614_242_144
// FeNiCu_583_256_161
// FeNiCu_518_284_198
// FeNiCu_484_297_219
// FeNiCu_450_310_240
// FeNiCu_416_321_263
// FeNiCu_382_332_286
// FeNiCu_349_341_310
// FeNiCu_317_349_334
// FeNiCu_287_355_358
