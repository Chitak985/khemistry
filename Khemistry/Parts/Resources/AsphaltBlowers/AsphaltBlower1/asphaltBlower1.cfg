PART
{
	name = asphaltBlower1
	module = Part
	author = Chitak 985 YT

	MODEL
	{
		model = Khemistry/Parts/Resources/AsphaltBlowers/AsphaltBlower1/asphaltBlower1
	}

	rescaleFactor = 1
	node_stack_top = 0.0, 1.15017, 0.0, 0.0, 1.0, 0.0, 2
	node_stack_bottom = 0.0, -1.1, 0.0, 0.0, -1.0, 0.0, 3
	TechRequired = advScienceTech
	entryCost = 10000
	cost = 2500
	category = Utility
	subcategory = 0
	title = Small Asphalt Blower
	manufacturer = Kerbin Oil Company
	description = <color=yellow>Asphalt Blower</color>\n<color=orange>EV Machine, uses between 2 and 4 A</color>\n\nThis asphalt blower turns bitumen derived from a distillation tower into usable asphalt. This machine has two modes: full-blown asphalt and semi-blown asphalt.
	attachRules = 1,1,1,0,0

	// --- standard part parameters ---
	mass = 13.5
	dragModelType = default
	maximum_drag = 0.1
	minimum_drag = 0.1
	angularDrag = 2
	crashTolerance = 4
	maxTemp = 2000 // = 3500
	bulkheadProfiles = size2, srf
	tags = #autoLOC_500654 //#autoLOC_500654 = conver isru mine )mining (ore process resource

	RESOURCE
	{
		name = EVEnergy
		amount = 4
		maxAmount = 4
	}

	MODULE
	{
		name = KhemistryISRU

		ConverterName = Asphalt Blower
		StartActionName = Start Asphalt Blower
		StopActionName = Stop Asphalt Blower

		RECIPE
		{
			name = Full-Blown Asphalt Production
			recipeTime = 1
			INPUT_RESOURCE:NEEDS[SolSystem]
			{
				name = EarthAir
				amount = 5
			}
			INPUT_RESOURCE:NEEDS[!SolSystem]
			{
				name = KerbinAir
				amount = 5
			}
			INPUT_RESOURCE
			{
				name = OilResidue
				amount = 20
			}
			PINPUT_RESOURCE
			{
				name = EVEnergy
				amount = 4
				period = 1
				powerfail = PAUSE
			}
			OUTPUT_RESOURCE
			{
				name = FullBlownAsphalt
				amount = 23.8
			}
			OUTPUT_RESOURCE
			{
				name = AsphaltOffgas
				amount = 1.2
				dumpExcess = true
			}
		}
		
		RECIPE
		{
			name = Semi-Blown Asphalt Production
			recipeTime = 1
			INPUT_RESOURCE:NEEDS[SolSystem]
			{
				name = EarthAir
				amount = 2
			}
			INPUT_RESOURCE:NEEDS[!SolSystem]
			{
				name = KerbinAir
				amount = 2
			}
			INPUT_RESOURCE
			{
				name = OilResidue
				amount = 25
			}
			PINPUT_RESOURCE
			{
				name = EVEnergy
				amount = 2
				period = 1
				powerfail = PAUSE
			}
			OUTPUT_RESOURCE
			{
				name = SemiBlownAsphalt
				amount = 26.3
			}
			OUTPUT_RESOURCE
			{
				name = AsphaltOffgas
				amount = 0.7
				dumpExcess = true
			}
		}
		
		maxDisplayDistance = 4  //meters
	}
}
